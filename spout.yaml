# spout.yaml - project config (playground)
#
# Discovered automatically by walking up from cwd to the git root.
# Overrides ~/.config/spout/spout.yaml on conflicts (deepest wins).
# Safe to commit — tokens go in .env, not here.
# See docs/cli/config.md for the field reference.

# Server to use for runs from this project.
server: localhost:3000

# Dashboard grouping label (all runs from this dir share it).
job: ml-training

# Template for sequential run names. Defaults to word-xxxx when omitted.
#
# Variables:
#   {n}          auto-incrementing counter per job
#   {input}      value you type at the prompt before this run starts
#   {date}       today (YYYY-MM-DD)
#   {time}       now (HH-mm-ss)
#   {ts}         Unix timestamp
#   {t:FORMAT}   custom datetime, e.g. {t:YYYY-MM-DD}, {t:dd/MM HH:mm}
run_name: "exp-{n}"

# ──────────────────────────────────────────────────────────────
# OBSERVE — opt-in LLM observability
#
# When enabled, spout's CLI taps each run's output, cheaply
# pre-filters it, and asks a model to characterize the run.
# It emits structured events (status, metrics, end-of-run
# synthesis, and built-in loop/drift/amnesia detectors for
# agent runs). Events show up live in the dashboard's right-
# hand observe panel and are written to events.jsonl locally.
#
# Without a key, observe runs in "stub mode" — it tracks byte
# counts and heuristically classifies the run type, no LLM call.
# Set ANTHROPIC_API_KEY in your ~/.config/spout/.env (or the env
# var named by model.token) to get real AI summaries + detectors.
#
# Privacy: type: api sends recent output to the model provider.
# For E2E (Tier 2) runs, use type: local (Ollama) to stay on-box.
# Per-run overrides: --observe / --no-observe / --otel.
# ──────────────────────────────────────────────────────────────

observe:
    enabled: true
    default_interval: 60s   # how often to check; the model may adjust this

    model:
        type: api                  # api (cloud) | local (Ollama) | cli
        model: claude-haiku-4-5
        # token: ANTHROPIC_API_KEY      # env-var NAME holding the key (default)
        # endpoint: http://localhost:11434   # only when type: local

    # Built-in detectors run with zero config when observe is on.
    # Uncomment to disable any.
    # detectors:
    #     classify: true    # auto-detect run type (build/training/agent/...)
    #     loop: true        # repeated failing action/error with no progress
    #     drift: true       # agent diverging from its stated goal
    #     amnesia: true     # agent re-asks/re-does settled work

    # Custom prompts — folded into the SAME LLM call as the built-ins,
    # so they cost almost nothing extra. `sources` (optional) must match
    # a stream `label` below — the parser enforces it.
    rules:
        - name: high-memory
          prompt: "Alert if memory > 80%, swap is being used, or signs of OOM."
          interval: 60s
          sources: [system-monitor, gpu]

        - name: training-stuck
          prompt: "Alert if loss hasn't decreased for 3+ epochs or GPU util < 30% for 2+ min."
          interval: 3m
          sources: [training, gpu]

        - name: nan-or-divergence
          prompt: "Alert on NaN values, exploding loss, or training divergence."
          interval: 30s
          sources: [training]

    # otel: http://localhost:4318    # also export events as OTLP/HTTP spans

# ──────────────────────────────────────────────────────────────
# STREAMS — multi-pane runs launched by bare `spout`.
# Each stream's `dir:` is relative to this yaml file.
# ──────────────────────────────────────────────────────────────
streams:
    - label: training
      command: python train.py --epochs 200
      dir: ./src/models
      env:
          CUDA_VISIBLE_DEVICES: "0"
          BATCH_SIZE: "64"

    - label: gpu
      command: watch -n 2 nvidia-smi

    - label: system-monitor
      command: htop -d 5

    - label: ui
      command: tensorboard --logdir ./logs
      dir: ./src/models
      env:
          PORT: "8080"
