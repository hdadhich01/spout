# spout.yaml - project config (the execution blueprint)
#
# Discovered automatically by walking up from cwd to the git root.
# Overrides ~/.config/spout/spout.yaml on conflicts (scalars override,
# lists replace, maps merge). Safe to commit - tokens go in .env.
# See docs/config.md for the authoritative schema.

# Server to use for this project. Either:
#   - a key from the `servers:` map (global or project)
#   - a raw host:port
server: localhost:3000

# Dashboard grouping label. Every run launched from this directory carries
# this tag so the dashboard can group them.
job: ml-training

# Template for sequential run names. Defaults to word-xxxx when omitted.
#
# Variables:
#   {n}          auto-incrementing counter per job
#   {input}      value you type at the prompt before this run starts
#   {date}       today (YYYY-MM-DD)
#   {time}       now (HH-mm-ss)
#   {ts}         Unix timestamp
#   {t:FORMAT}   custom datetime, e.g. {t:YYYY-MM-DD}, {t:dd/MM HH:mm}
#                Tokens: YYYY YY MM DD dd HH hh mm ss (Moment/Java style)
#
# Examples:
#   run_name: "exp-{n}"                # exp-1, exp-2, exp-3
#   run_name: "{t:YYYY-MM-DD}-{n}"     # 2026-04-16-1
#   run_name: "{input}-{n}"            # prompts for a label, e.g. lr-sweep-1
run_name: "exp-{n}"

# ──────────────────────────────────────────────────────────────
# OBSERVE (opt-in LLM observability)
# A CLI-side loop feeds recent output to a model and emits structured
# events: live status, extracted metrics, an end-of-run synthesis, and
# built-in agent-failure detectors. One engine — your custom rules ride
# the same LLM call as the built-ins.
# ──────────────────────────────────────────────────────────────

observe:
    enabled: false
    default_interval: 60s # fallback poll cadence when a rule sets none

    # The backing model. type: api (cloud, default), local (Ollama/LM
    # Studio), or cli (shell out to an installed agent).
    #   - api:   model: a model id; token: env-var NAME holding the key
    #            (defaults to ANTHROPIC_API_KEY).
    #   - local: endpoint: the OpenAI-compatible URL.
    # NOTE: on E2E (Tier 2) runs an `api` model still SEES your output —
    # use type: local or cli to keep everything on-box.
    model:
        type: api
        model: claude-haiku-4-5
        # token: ANTHROPIC_API_KEY
        # endpoint: http://localhost:11434  # when type: local

    # Built-in detectors run with zero config when observe is enabled.
    # Uncomment to turn any off.
    # detectors:
    #     classify: true   # auto-detect run type
    #     loop: true       # repeated identical failure/attempt
    #     drift: true      # agent diverging from its stated goal
    #     amnesia: true    # re-asking / re-doing / dropping constraints

    # Custom prompts, folded into the same LLM call. `sources` (optional)
    # must match stream labels below — the parser enforces it as a key.
    rules:
        - name: high-memory
          prompt: "Alert if memory > 80%, swap active, or signs of OOM."
          interval: 60s
          sources: [system-monitor, gpu]

        - name: training-stuck
          prompt: "Alert if loss hasn't decreased for 3+ epochs."
          interval: 3m
          sources: [training, gpu]

# ──────────────────────────────────────────────────────────────
# STREAMS
# Bare `spout` spins these up into discrete tmux panes under one
# tmux session. Each `dir:` is resolved relative to this yaml file.
# Stream-level `env:` overrides anything from walked-up .env files.
# ──────────────────────────────────────────────────────────────

streams:
    - label: training
      command: python train.py --epochs 200 --lr 0.001
      dir: ./src/models
      env:
          CUDA_VISIBLE_DEVICES: "0"
          BATCH_SIZE: "64"

    - label: gpu
      command: watch -n 2 nvidia-smi

    - label: system-monitor
      command: htop -d 5

    - label: ui
      command: tensorboard --logdir ./logs
      dir: ./src/models
      env:
          PORT: "8080"
