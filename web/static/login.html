<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>spout · admin login</title>
  <link rel="icon" href="/static/favicon.svg">
  <style>
    :root {
      --bg: #0a0a0a;
      --panel: #0e0e0e;
      --border: #383838;
      --border-hi: #4a4a4a;
      --aqua: #5ac8e2;
      --aqua-dim: #2d6573;
      --text: #ededed;
      --dim: #9a9a9a;
      --dimmer: #6a6a6a;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: var(--bg); color: var(--text);
      font-family: 'SF Mono', 'JetBrains Mono', 'Cascadia Code', 'Menlo', monospace;
      font-size: 13px; height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }

    .frame {
      width: 360px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      position: relative;
    }
    .frame-head {
      display: flex; align-items: center; gap: 10px;
      margin: -10px 16px 0;
      font-size: 11px; letter-spacing: 0.04em;
    }
    .frame-head .brand {
      background: var(--panel); padding: 0 8px;
      color: var(--aqua); font-weight: 600; font-size: 13px;
    }
    .frame-head .rule { flex: 1; height: 1px; background: var(--border); }
    .frame-head .tag { background: var(--panel); padding: 0 8px; color: var(--dim); text-transform: lowercase; }

    .body { padding: 22px 22px 20px; }
    .prompt { color: var(--dim); font-size: 11px; margin-bottom: 18px; }
    .prompt b { color: var(--aqua); font-weight: 500; }

    .error {
      background: #1a0e0e; border: 1px solid #5a2424; color: #f87171;
      padding: 8px 10px; border-radius: 4px; font-size: 12px; margin-bottom: 12px;
      display: none;
    }

    input[type="password"] {
      width: 100%;
      background: #0a0a0a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 13px;
      margin-bottom: 12px;
      transition: border-color 160ms var(--ease-out);
    }
    input[type="password"]:focus { outline: none; border-color: var(--aqua); }

    button {
      width: 100%;
      background: #0e2b33;
      border: 1px solid var(--aqua-dim);
      color: var(--aqua);
      padding: 10px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 100ms var(--ease-out),
                  background-color 160ms var(--ease-out),
                  border-color 160ms var(--ease-out);
    }
    button:active { transform: scale(0.97); }
    @media (hover: hover) and (pointer: fine) {
      button:hover { background: #103840; border-color: var(--aqua); }
    }

    .frame-foot {
      display: flex; align-items: center; gap: 12px;
      margin: 0 16px -10px;
      padding-top: 14px;
      font-size: 10px;
    }
    .frame-foot .rule { flex: 1; height: 1px; background: var(--border); }
    .frame-foot .hint {
      background: var(--panel); padding: 0 8px;
      color: var(--dimmer); text-transform: lowercase;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
      button:active { transform: none; }
    }
  </style>
</head>
<body>
  <form class="frame" method="POST" action="/admin/login">
    <header class="frame-head">
      <span class="brand">▍ spout</span>
      <span class="rule"></span>
      <span class="tag">admin login</span>
    </header>

    <div class="body">
      <p class="prompt">enter the <b>admin password</b> to view the dashboard remotely.</p>
      <div class="error" id="error">wrong password.</div>
      <input type="password" name="password" placeholder="·····················" autofocus />
      <button type="submit">log in</button>
    </div>

    <footer class="frame-foot">
      <span class="rule"></span>
      <span class="hint">same-box access doesn't need this</span>
      <span class="rule"></span>
    </footer>
  </form>

  <script>
    if (new URLSearchParams(location.search).has('error')) {
      document.getElementById('error').style.display = 'block';
    }
  </script>
</body>
</html>
